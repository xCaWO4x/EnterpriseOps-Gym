<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DataSea — Admin</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header><strong>DataSea</strong> admin
  <button id="refresh" class="small">Refresh</button>
  <button id="export" class="small">Export JSONL</button>
  <span id="export-msg" class="muted"></span>
</header>
<main class="admin">
  <div class="card">
    <h3>Workers</h3>
    <table id="workers"><thead><tr><th>Worker</th><th>Mode</th><th>Active</th><th>Assigned</th><th>Sessions</th><th>Passed</th><th>Failed</th><th>Flagged</th><th>Other</th><th></th></tr></thead><tbody></tbody></table>
    <h4>Add worker</h4>
    <div class="row">
      <input id="new-id" placeholder="worker id" />
      <select id="new-mode"><option>onboarding</option><option>production</option></select>
    </div>
    <label>Assigned tasks (none selected = the whole pool for that mode)</label>
    <select id="new-tasks" multiple size="8"></select>
    <button id="add-worker" class="small">Create & show link</button>
    <div id="link-msg" class="mono"></div>
  </div>
  <div class="card">
    <h3>Sessions</h3>
    <table id="sessions"><thead><tr><th>Started</th><th>Worker</th><th>Mode</th><th>Kind</th><th>Task</th><th>Domain</th><th>Status</th><th>Verifier</th><th>Duration (s)</th><th>Calls (errors)</th><th>Reset</th><th></th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card" id="detail" hidden>
    <h3>Session detail <span id="detail-id" class="muted"></span></h3>
    <div id="detail-body"></div>
  </div>
</main>
<script src="/static/schema_form.js"></script>
<script>
const { h } = SchemaForm;
const $ = (id) => document.getElementById(id);
const api = async (p, o) => { const r = await fetch(p, o); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const pre = (v) => h("pre", {}, typeof v === "string" ? v : JSON.stringify(v, null, 2));

const post = (p, body) => api(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const showLink = (r) => { $("link-msg").textContent = `${r.worker_id}: ${location.origin}${r.link_path}  (shown once — send it privately)`; };

async function load() {
  const [rows, workers, tasks] = await Promise.all([api("/api/admin/sessions"), api("/api/admin/workers"), api("/api/admin/tasks")]);
  if (!$("new-tasks").options.length)
    $("new-tasks").replaceChildren(...tasks.map((t) => h("option", { value: t.task_id }, `${t.pool} · ${t.domain} · ${t.task_id}`)));
  const byWorker = {};
  for (const r of rows) {
    const w = (byWorker[r.worker_id] ||= { n: 0, passed: 0, failed: 0, flagged_unclear: 0, other: 0 });
    w.n++; if (r.status in w) w[r.status]++; else w.other++;
  }
  const ids = [...new Set([...workers.map((w) => w.worker_id), ...Object.keys(byWorker)])];
  const acct = Object.fromEntries(workers.map((w) => [w.worker_id, w]));
  $("workers").tBodies[0].replaceChildren(...ids.map((k) => {
    const w = byWorker[k] || { n: 0, passed: 0, failed: 0, flagged_unclear: 0, other: 0 }, a = acct[k];
    return h("tr", {}, h("td", {}, k), h("td", {}, a ? a.mode : "(legacy)"), h("td", {}, a ? (a.active ? "yes" : "no") : "—"),
      h("td", {}, a ? (a.assigned_task_ids.length || "pool") : "—"),
      h("td", {}, w.n), h("td", {}, w.passed), h("td", {}, w.failed), h("td", {}, w.flagged_unclear), h("td", {}, w.other),
      h("td", {}, a ? [
        h("button", { class: "small", onclick: async () => { if (confirm("Issue a new link? The old one stops working.")) showLink(await post(`/api/admin/workers/${k}/rotate`)); } }, "New link"),
        h("button", { class: "small", onclick: async () => { await post(`/api/admin/workers/${k}`, { mode: a.mode === "onboarding" ? "production" : "onboarding" }); load(); } }, a.mode === "onboarding" ? "→ production" : "→ onboarding"),
        h("button", { class: "small danger", onclick: async () => { await post(`/api/admin/workers/${k}`, { active: !a.active }); load(); } }, a.active ? "Disable" : "Enable"),
      ] : ""));
  }));
  $("sessions").tBodies[0].replaceChildren(...rows.map((r) =>
    h("tr", { class: `st-${r.status}` },
      h("td", {}, r.started_at.replace("T", " ").slice(0, 19)), h("td", {}, r.worker_id),
      h("td", {}, r.mode), h("td", { title: r.parent_session_id || "" }, r.attempt_kind + (r.parent_session_id ? " ↩" : "")),
      h("td", { class: "mono" }, r.task_id), h("td", {}, r.domain),
      h("td", {}, r.status + (r.live ? " (live)" : "") + (r.awaiting_correction ? " (fix offered)" : "")),
      h("td", {}, r.verifier_pass == null ? "—" : r.verifier_pass ? "PASS" : "FAIL"),
      h("td", {}, r.duration_seconds ?? "—"), h("td", {}, `${r.num_tool_calls} (${r.num_tool_errors})`), h("td", {}, r.reset_at ? "yes" : "no"),
      h("td", {}, h("button", { class: "small", onclick: () => detail(r.session_id) }, "View"),
        (r.live || r.awaiting_correction) ? h("button", { class: "small danger", onclick: async () => { if (confirm("Abandon and reset this session's database?")) { await api(`/api/admin/sessions/${r.session_id}/reset`, { method: "POST" }); load(); } } }, "Reset") : null))));
}

$("add-worker").onclick = async () => {
  const worker_id = $("new-id").value.trim(); if (!worker_id) return;
  const task_ids = [...$("new-tasks").selectedOptions].map((o) => o.value);
  try { showLink(await post("/api/admin/workers", { worker_id, mode: $("new-mode").value, task_ids })); $("new-id").value = ""; load(); }
  catch (e) { alert(e.message); }
};

async function detail(id) {
  const { session: s, steps } = await api(`/api/admin/sessions/${id}`);
  $("detail").hidden = false; $("detail-id").textContent = id;
  const v = s.verifier || {};
  const verRows = Object.entries(v.verification_results || {}).map(([name, r]) =>
    h("tr", { class: r.passed ? "st-passed" : "st-failed" }, h("td", {}, r.passed ? "PASS" : "FAIL"), h("td", {}, name),
      h("td", { class: "mono" }, JSON.stringify(r.expected)), h("td", { class: "mono" }, JSON.stringify(r.actual)), h("td", {}, pre(r.query || r.error || ""))));
  $("detail-body").replaceChildren(
    h("p", {}, h("strong", {}, "Task: "), s.user_prompt),
    h("p", {}, h("strong", {}, "Status: "), s.status, ` — ${s.mode} / ${s.attempt_kind}`,
      s.parent_session_id ? h("span", {}, " — parent ", h("a", { href: "#", onclick: (e) => { e.preventDefault(); detail(s.parent_session_id); } }, s.parent_session_id)) : "",
      " — ", h("strong", {}, "Worker note: "), s.worker_note || "—"),
    h("p", {}, h("strong", {}, "Final reply: "), s.final_response || "—"),
    h("h4", {}, "Verifier output"),
    v.error ? pre(v.error) : h("table", {}, h("thead", {}, h("tr", {}, ["", "Verifier", "Expected", "Actual", "Query"].map((x) => h("th", {}, x)))), h("tbody", {}, verRows)),
    h("h4", {}, `Trajectory (${steps.length} tool calls)`),
    ...steps.map((st) => h("details", { class: st.error ? "err" : "" },
      h("summary", {}, `#${st.step} ${st.timestamp.slice(11, 19)} ${st.tool_name}${st.error ? " — ERROR" : ""} (${st.duration_ms} ms)`),
      h("div", {}, h("strong", {}, "Arguments"), pre(st.arguments), h("strong", {}, "Result"), pre(st.result), st.error ? h("div", { class: "error" }, st.error) : null))),
    h("h4", {}, "Environment & provenance"), pre({ environment: s.environment, provenance: s.provenance }),
    h("details", {}, h("summary", {}, "Raw session JSON"), pre(s)));
  $("detail").scrollIntoView({ behavior: "smooth" });
}

$("refresh").onclick = load;
$("export").onclick = async () => { const r = await api("/api/admin/export", { method: "POST" }); $("export-msg").textContent = `${JSON.stringify(r.counts)} → ${r.out_dir}`; };
load();
</script>
</body>
</html>
